<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Should I buy this now? — Indian Market Signals</title>
  <meta name="description" content="Real-time Indian market signals. Simple YES / NO / WAIT answers to your financial decisions." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <div>
        <h1>Should I buy / do this now?</h1>
        <p id="last-updated" class="subtitle">Loading signals…</p>
      </div>
    </div>
  </header>

  <main>
    <div id="loading" class="loading-state">
      <div class="spinner"></div>
      <p>Checking today's signals…</p>
      <p class="loading-sub">This takes a few seconds</p>
    </div>

    <div id="error" class="error-state hidden">
      <p id="error-msg">Unable to load signals.</p>
      <button onclick="loadSignals()">Try again</button>
    </div>

    <div id="content" class="hidden">
      <div id="best-bets"></div>
      <div id="signal-grid"></div>
      <p class="disclaimer">These are signals, not financial advice — use as a starting point only.</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
