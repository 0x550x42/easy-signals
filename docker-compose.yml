services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        ports:
            - '5001:5001'
        environment:
            - PORT=5001
        volumes:
            - ./backend:/app
            - /app/node_modules
        command: npm run dev

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        ports:
            - '3000:3000'
        depends_on:
            - backend
        environment:
            - VITE_API_URL=http://backend:5001
        volumes:
            - ./frontend:/app
            - /app/node_modules
        command: npm run dev -- --host 0.0.0.0
